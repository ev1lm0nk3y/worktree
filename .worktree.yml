name: worktree
session: worktree_workers
ticketing: github
iterm:
  open: window
  focus: true
layout: tiled
workers: 1
claude_context: |
  # worktree

  Read CLAUDE.md first for this repo's architecture and conventions.

  ## Generated context files (auto-created per worktree, gitignored)
  Not obvious from source alone: WORKTREE_TICKET.md caches the issue this worktree is for,
  treat it as the scope of record. WORKTREE_COORDINATION.md appears only when workers > 1 and
  holds each worker's archetype assignment - coordinate through it rather than assuming another
  worker's state. OVERSEER.md appears only with --watcher. WORKTREE_WORKERS.json is a
  machine-managed registry; leave it alone.

  ## Working in a session
  Stay within your assigned archetype's lane and this worktree's directory. Rebase on
  origin/main before starting and again before opening a PR. Run the commands below before
  calling work done. `wt list` shows other active sessions if you need that context.

  Full orchestration guide (archetypes, pools, `wt split` scaling, the Guide archetype for
  ticket-less starts): agent-instructions.md in the repo root.

commands:
  dev: npm run dev
  lint: npm run lint
  build: npm run build
